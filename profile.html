<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="管理 ATLAS 账户昵称与头像。">
    <title>编辑个人资料 - ATLAS</title>
    <link rel="icon" type="image/jpeg" href="assets/img/atlas-logo.jpg">
    <link rel="stylesheet" href="assets/css/atlas-shell.css?v=20261119a">
    <link rel="stylesheet" href="assets/css/atlas-account.css?v=20261119b">
</head>
<body class="has-global-nav" data-auth-required="true">
    <nav class="global-nav"></nav>
    <main class="atlas-account-page">
        <div class="atlas-account-shell">
            <a class="atlas-account-back-link" href="home.html">
                <span aria-hidden="true">←</span> 返回工作台
            </a>

            <header class="atlas-account-page-header">
                <div>
                    <p class="atlas-account-eyebrow">ACCOUNT SETTINGS</p>
                    <h1>编辑个人资料</h1>
                    <p>更新头像和昵称，它们会显示在 ATLAS 导航栏与账户菜单中。</p>
                </div>
                <span class="atlas-account-sync-label">
                    <span aria-hidden="true"></span>
                    当前账户资料
                </span>
            </header>

            <p class="atlas-account-page-status" data-account-editor-status role="status" aria-live="polite"></p>

            <div class="atlas-account-layout">
                <form class="atlas-account-editor" data-account-editor>
                    <section class="atlas-account-form-section" aria-labelledby="accountIdentityTitle">
                        <div class="atlas-account-section-heading">
                            <span class="atlas-account-section-icon" aria-hidden="true">01</span>
                            <div>
                                <h2 id="accountIdentityTitle">基本信息</h2>
                                <p>让你的账户更容易被识别。</p>
                            </div>
                        </div>

                        <label class="atlas-account-field">
                            <span>昵称 <b>必填</b></span>
                            <input name="display_name" type="text" maxlength="120" autocomplete="name" placeholder="输入你希望显示的名称" required>
                            <small>昵称会同步显示在网站导航栏和账户菜单中。</small>
                        </label>
                    </section>

                    <section class="atlas-account-form-section" aria-labelledby="accountAvatarTitle">
                        <div class="atlas-account-section-heading">
                            <span class="atlas-account-section-icon" aria-hidden="true">02</span>
                            <div>
                                <h2 id="accountAvatarTitle">头像</h2>
                                <p>选择一张清晰、易辨认的图片。</p>
                            </div>
                        </div>

                        <label class="atlas-account-field">
                            <span>上传图片</span>
                            <input name="avatar_file" type="file" accept="image/jpeg,image/png,image/webp">
                            <small>支持 JPG、PNG 或 WebP，最大 5 MB。上传需要启用 Supabase 头像存储。</small>
                        </label>

                        <div class="atlas-account-field-divider"><span>或使用图片链接</span></div>

                        <label class="atlas-account-field">
                            <span>头像图片 HTTPS 地址</span>
                            <input name="avatar_url" type="url" maxlength="2048" placeholder="https://example.com/avatar.jpg" autocomplete="url">
                            <small>图片需可公开访问。选择本地文件时，将优先使用上传的图片。</small>
                        </label>
                    </section>

                    <footer class="atlas-account-form-footer">
                        <span>保存后将立即更新导航栏显示。</span>
                        <button type="submit" data-account-editor-save>
                            <span>保存资料</span>
                            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M10 5l5 5-5 5"/></svg>
                        </button>
                    </footer>
                </form>

                <aside class="atlas-account-preview-column" aria-label="资料预览与说明">
                    <section class="atlas-account-preview-panel" aria-labelledby="accountPreviewTitle">
                        <p class="atlas-account-preview-eyebrow">LIVE PREVIEW</p>
                        <h2 id="accountPreviewTitle">导航栏预览</h2>
                        <p class="atlas-account-preview-description">这是你的头像和昵称在网站导航栏中的显示效果。</p>

                        <div class="atlas-account-nav-preview">
                            <div class="atlas-account-preview-avatar">
                                <img data-account-preview-image alt="" hidden>
                                <span data-account-preview-fallback>A</span>
                            </div>
                            <strong data-account-preview-name>ATLAS 用户</strong>
                            <svg class="atlas-account-preview-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
                        </div>
                        <div class="atlas-account-preview-caption">
                            <span aria-hidden="true"></span>
                            修改时实时预览，保存后同步到全站
                        </div>
                    </section>

                    <section class="atlas-account-help-panel" aria-labelledby="accountPrivacyTitle">
                        <span class="atlas-account-help-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 2.9 8.3 7 10 4.1-1.7 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
                        </span>
                        <div>
                            <h2 id="accountPrivacyTitle">你的账户资料</h2>
                            <p>昵称和头像保存在当前登录账户中。上传头像仅接受 JPG、PNG 或 WebP 格式，最大 5 MB。</p>
                        </div>
                    </section>
                </aside>
            </div>
        </div>
    </main>

    <script src="assets/js/atlas-shell.js?v=20261119b"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-auth.js?v=20260912"></script>
    <script src="assets/js/atlas-account-profile.js?v=20261119a"></script>
</body>
</html>
