<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="重置 ATLAS 账户密码">
    <title>重置密码 - ATLAS</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/3d-effects.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/dark-theme.css">
    <link rel="stylesheet" href="assets/css/atlas-shell.css?v=20260910c">
    <link rel="stylesheet" href="assets/css/atlas-scroll.css">
</head>
<body class="has-global-nav">
    <div class="animated-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="auth-container">
        <a href="index.html" class="auth-logo">
            <span class="logo-text">ATLAS</span>
        </a>

        <div class="auth-card glass-card elevation-4">
            <div class="auth-header">
                <h1 class="auth-title">重置密码</h1>
                <p class="auth-subtitle">通过邮箱安全链接设置新密码</p>
            </div>

            <div id="authStatus" class="auth-status" role="status" aria-live="polite"></div>

            <form class="auth-form" id="resetPasswordForm">
                <div class="form-group">
                    <label class="form-label" for="resetEmail">邮箱地址</label>
                    <input id="resetEmail" type="email" class="form-input" placeholder="your@email.com" required autocomplete="email">
                </div>

                <button type="submit" class="btn-submit btn-3d">
                    <span>发送重置邮件</span>
                </button>
            </form>

            <form class="auth-form" id="updatePasswordForm" hidden>
                <div class="form-group">
                    <label class="form-label" for="newPassword">新密码</label>
                    <input id="newPassword" name="newPassword" type="password" class="form-input" placeholder="至少6个字符" required minlength="6" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">确认新密码</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" class="form-input" placeholder="再次输入新密码" required minlength="6" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-submit btn-3d">
                    <span>保存新密码</span>
                </button>
            </form>

            <div class="auth-footer">
                <span>想起密码了？</span>
                <a href="login.html" class="link">返回登录</a>
            </div>
        </div>

        <a href="index.html" class="back-link">返回首页</a>
    </div>

    <script src="assets/js/atlas-shell.js?v=20260910c"></script>
    <script src="assets/js/atlas-scroll.js"></script>
    <script src="assets/js/3d-effects.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-auth.js?v=20260912"></script>
</body>
</html>
