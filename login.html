<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to ATLAS - Personal Intelligence OS">
    <title>Login - ATLAS</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/3d-effects.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/atlas-shell.css?v=20260910c">
    <link rel="stylesheet" href="assets/css/atlas-scroll.css">
</head>
<body class="has-global-nav">
    <!-- Language & Theme Controls -->
    <div class="top-controls">
        <div class="control-group">
            <button class="control-btn lang-switch" data-lang="en" title="English">
                🇺🇸
            </button>
            <button class="control-btn lang-switch" data-lang="zh-CN" title="中文">
                🇨🇳
            </button>
        </div>
        <div class="control-group">
            <button class="control-btn theme-switch" data-theme="light" title="Light Mode">
                ☀️
            </button>
            <button class="control-btn theme-switch active" data-theme="system" title="System">
                💻
            </button>
            <button class="control-btn theme-switch" data-theme="dark" title="Dark Mode">
                🌙
            </button>
        </div>
    </div>

    <!-- Animated Background -->
    <div class="animated-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="auth-container">
        <!-- Logo -->
        <a href="index.html" class="auth-logo">
            <span class="logo-text">ATLAS</span>
        </a>

        <!-- Login Form -->
        <div class="auth-card glass-card elevation-4">
            <div class="auth-header">
                <h1 class="auth-title" >登录 ATLAS</h1>
                <p class="auth-subtitle" >欢迎回来，继续你的智能工作流</p>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button class="social-btn google-btn">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span data-i18n="login.google">使用 Google 登录</span>
                </button>

                <button class="social-btn github-btn">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
                    </svg>
                    <span data-i18n="login.github">使用 GitHub 登录</span>
                </button>

                <button class="social-btn apple-btn">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    <span data-i18n="login.apple">使用 Apple 登录</span>
                </button>
            </div>

            <div class="divider">
                <span data-i18n="login.or">或</span>
            </div>

            <!-- Email Login Form -->
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" >邮箱地址</label>
                    <input
                        type="email"
                        class="form-input"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" >密码</label>
                    <div class="password-input">
                        <input
                            type="password"
                            class="form-input"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" class="form-checkbox">
                        <span >记住我</span>
                    </label>
                    <a href="reset-password.html" class="link" >忘记密码？</a>
                </div>

                <button type="submit" class="btn-submit btn-3d">
                    <span >登录</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                    </svg>
                </button>
            </form>

            <div class="auth-footer">
                <span >还没有账户？</span>
                <a href="signup.html" class="link" >立即注册</a>
            </div>
        </div>

        <!-- Demo Account Notice -->
        <div class="demo-account-notice">
            <div style="font-size: 0.875rem; color: #6b7280; line-height: 1.6;">
                <strong style="color: #2563eb; display: block; margin-bottom: 0.5rem;">💡 演示账户</strong>
                邮箱：<code style="background: rgba(37, 99, 235, 0.1); padding: 0.25rem 0.5rem; border-radius: 0.25rem; color: #2563eb;">demo@atlas.com</code><br>
                密码：<code style="background: rgba(37, 99, 235, 0.1); padding: 0.25rem 0.5rem; border-radius: 0.25rem; color: #2563eb;">demo123</code>
            </div>
        </div>

        <!-- Back to Home -->
        <a href="index.html" class="back-link">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            <span data-i18n="nav.home">返回首页</span>
        </a>
    </div>

    <script src="assets/js/atlas-shell.js?v=20260910c"></script>
    <script src="assets/js/atlas-scroll.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/3d-effects.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
